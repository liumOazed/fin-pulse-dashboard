name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 12 * * 1-5"   # ~pre-US-open
    - cron: "35 21 * * 1-5"  # after US close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vendor Plotly (local copy, no CDN dependency)
        run: |
          if [ ! -f assets/vendor/plotly.min.js ]; then
            mkdir -p assets/vendor /tmp/pl
            cd /tmp/pl && npm pack plotly.js-dist-min@2.35.2 >/dev/null && tar xzf plotly.js-dist-min-*.tgz
            cd - >/dev/null && cp /tmp/pl/package/plotly.min.js assets/vendor/plotly.min.js
          fi
      - name: Fetch market data and compute panels
        run: python scripts/build_data.py || echo "::warning::Data fetch failed - keeping previous data"
      - name: Commit refreshed data
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data assets/vendor
          git diff --cached --quiet || (git commit -m "chore: refresh data [skip ci]" && git push)
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
